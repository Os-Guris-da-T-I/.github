<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="Entrar no Fluxer">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#a30000"/></linearGradient>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="18" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="10" y="14" width="280" height="56" rx="8" fill="#ff1e1e" opacity=".5" filter="url(#b)"><animate attributeName="opacity" values=".3;.7;.3" dur="2.2s" repeatCount="indefinite"/></rect>
  <g filter="url(#r)">
    <rect x="8" y="10" width="284" height="56" rx="8" fill="url(#red)" stroke="#000" stroke-width="3"/>
  </g>
  <text x="150" y="48" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="30" letter-spacing="4" fill="#fff">ENTRAR NO FLUXER ▸</text>
</svg>
