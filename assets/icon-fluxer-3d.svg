<linearGradient id="redg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3b2a"/><stop offset=".55" stop-color="#e10600"/><stop offset="1" stop-color="#a30000"/></linearGradient><path id="shp" d="M130 90 H270 A50 50 0 0 1 320 140 V220 A50 50 0 0 1 270 270 H205 L135 330 L150 270 H130 A50 50 0 0 1 80 220 V140 A50 50 0 0 1 130 90 Z"/></defs><style>.drip{transform-box:fill-box;transform-origin:50% 0%;animation:drip 3.6s ease-in-out infinite}
@keyframes drip{0%,100%{transform:scaleY(.55)}55%{transform:scaleY(1.25)}}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob 3s ease-in-out infinite}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1deg)}}
.flick{animation:flick 2.4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}8%{opacity:.35}10%{opacity:1}52%{opacity:.6}54%{opacity:1}}
.pulse{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
.twk{animation:twk 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}.float{animation:fl 3.2s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(8px) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:sh 3.2s ease-in-out infinite}@keyframes sh{0%,100%{transform:scale(1.1);opacity:.6}50%{transform:scale(.8);opacity:.3}}
.orbit{transform-box:fill-box;transform-origin:center;animation:or 18s linear infinite}@keyframes or{to{transform:rotate(360deg)}}</style><ellipse cx="200" cy="378" rx="95" ry="12" fill="#000" opacity=".55" class="shadow"/>
