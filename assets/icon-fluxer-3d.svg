<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" role="img" aria-label="Fluxer">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#ff1e1e"/><stop offset="1" stop-color="#8a0000"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a0000"/><stop offset="1" stop-color="#2a0000"/></linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".6"/><stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/></radialGradient>
    <filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <circle cx="130" cy="125" r="115" fill="url(#aura)"><animate attributeName="r" values="105;120;105" dur="3s" repeatCount="indefinite"/></circle>
  <ellipse cx="130" cy="256" rx="70" ry="9" fill="#000" opacity=".6" filter="url(#b)"><animate attributeName="rx" values="70;52;70" dur="3s" repeatCount="indefinite"/></ellipse>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 -12;0 6" dur="3s" repeatCount="indefinite"/>
    <!-- extrusion layers -->
    <g fill="url(#side)">
      <rect x="62" y="56" width="140" height="140" rx="36" transform="translate(14 14)"/>
      <rect x="62" y="56" width="140" height="140" rx="36" transform="translate(10 10)"/>
      <rect x="62" y="56" width="140" height="140" rx="36" transform="translate(6 6)"/>
    </g>
    <rect x="58" y="52" width="140" height="140" rx="36" fill="url(#face)" stroke="#2a0000" stroke-width="3"/>
    <path d="M70 70 Q120 52 160 62" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
    <!-- F glyph -->
    <path d="M102 164 V86 H162 M102 122 H148" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
