<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Comunidade Guris da T.I">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#ff1e1e"/><stop offset="1" stop-color="#7a0000"/></linearGradient>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#0b0b0c"/><path d="M0 0H120M0 30H120M0 60H120M60 0V30M0 30V60M120 30V60" stroke="#1b1b1e" stroke-width="2" fill="none"/></pattern>
    <filter id="rough" x="-10%" y="-30%" width="120%" height="170%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="210" fill="url(#brick)"/>
  <ellipse cx="600" cy="105" rx="360" ry="55" fill="#ff1e1e" opacity=".4" filter="url(#b)"><animate attributeName="opacity" values=".25;.55;.25" dur="3.3s" repeatCount="indefinite"/></ellipse>
  <g filter="url(#rough)" font-family="Impact, 'Arial Black', sans-serif" font-size="120" text-anchor="middle" letter-spacing="6">
    <text x="606" y="132" fill="#000" opacity=".85">COMUNIDADE</text>
    <text x="600" y="126" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round">COMUNIDADE</text>
    <text x="600" y="126" fill="url(#red)" stroke="#2a0000" stroke-width="3">COMUNIDADE</text>
  </g>
  <g stroke="#ff1e1e" stroke-linecap="round">
    <line x1="330" y1="130" x2="330" y2="146" stroke-width="8"><animate attributeName="y2" values="142;186;142" dur="3.7s" repeatCount="indefinite"/></line>
    <line x1="610" y1="130" x2="610" y2="144" stroke-width="7"><animate attributeName="y2" values="140;178;140" dur="3s" repeatCount="indefinite"/></line>
    <line x1="870" y1="130" x2="870" y2="148" stroke-width="9"><animate attributeName="y2" values="144;190;144" dur="4.5s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" font-weight="bold" letter-spacing="6" fill="#bbb">100% BRASILEIRA · 100% INDEPENDENTE</text>
</svg>
