<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Aprenda. Construa. Compartilhe.">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#ff1e1e"/><stop offset="1" stop-color="#7a0000"/></linearGradient>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#0b0b0c"/><path d="M0 0H120M0 30H120M0 60H120M60 0V30M0 30V60M120 30V60" stroke="#1b1b1e" stroke-width="2" fill="none"/></pattern>
    <filter id="rough" x="-10%" y="-30%" width="120%" height="170%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="51" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="200" fill="url(#brick)"/>
  <ellipse cx="600" cy="100" rx="440" ry="50" fill="#ff1e1e" opacity=".35" filter="url(#b)"><animate attributeName="opacity" values=".2;.5;.2" dur="3.5s" repeatCount="indefinite"/></ellipse>
  <g filter="url(#rough)" font-family="Impact, 'Arial Black', sans-serif" font-size="78" text-anchor="middle" letter-spacing="5">
    <text x="605" y="115" fill="#000" opacity=".85">APRENDA. CONSTRUA. COMPARTILHE.</text>
    <text x="600" y="110" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">APRENDA. CONSTRUA. COMPARTILHE.</text>
    <text x="600" y="110" fill="url(#red)" stroke="#2a0000" stroke-width="2">APRENDA. CONSTRUA. COMPARTILHE.</text>
  </g>
  <g stroke="#ff1e1e" stroke-linecap="round">
    <line x1="260" y1="114" x2="260" y2="124" stroke-width="7"><animate attributeName="y2" values="124;160;124" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="600" y1="114" x2="600" y2="122" stroke-width="6"><animate attributeName="y2" values="122;152;122" dur="3s" repeatCount="indefinite"/></line>
    <line x1="940" y1="114" x2="940" y2="124" stroke-width="7"><animate attributeName="y2" values="124;164;124" dur="4.2s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" letter-spacing="5" fill="#999">© GURIS DA T.I · TECNOLOGIA É MELHOR QUANDO É COMPARTILHADA</text>
</svg>
