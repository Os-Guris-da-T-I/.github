<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
  <defs>
    <pattern id="stripes" width="60" height="70" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <rect width="60" height="70" fill="#ff1e1e"/>
      <rect width="30" height="70" fill="#0a0a0a"/>
      <animateTransform attributeName="patternTransform" type="translate" additionalTransform="skewX(-30)" from="0 0" to="60 0" dur="2.5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
  </defs>
  <g filter="url(#r)">
    <rect x="10" y="12" width="1180" height="46" fill="url(#stripes)" stroke="#000" stroke-width="3"/>
  </g>
  <rect x="330" y="20" width="540" height="30" fill="#0a0a0a"/>
  <text x="600" y="42" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="22" letter-spacing="6" fill="#ff1e1e">GURIS DA T.I • ZONA LIVRE DE CÓDIGO</text>
</svg>
