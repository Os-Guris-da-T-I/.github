<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
  </defs>
  <g filter="url(#r)">
    <rect x="30" y="34" width="1140" height="6" fill="#ff1e1e"/>
    <rect x="30" y="44" width="1140" height="3" fill="#7a0000"/>
  </g>
  <g fill="#ff1e1e">
    <rect x="120" y="26" width="90" height="8"><animate attributeName="x" values="120;160;100;120" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;1" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="520" y="48" width="140" height="6"><animate attributeName="x" values="520;470;560;520" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="900" y="24" width="70" height="10"><animate attributeName="x" values="900;940;880;900" dur="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;1" dur="1.3s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#fff" opacity=".85">
    <rect x="300" y="36" width="40" height="2"><animate attributeName="x" values="300;1000;300" dur="5s" repeatCount="indefinite"/></rect>
  </g>
</svg>
