<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="O GennisCode é multiplataforma: Windows, Linux, macOS e Android">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#ff1e1e"/><stop offset="1" stop-color="#7a0000"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a1d"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#0b0b0c"/><path d="M0 0H120M0 30H120M0 60H120M60 0V30M0 30V60M120 30V60" stroke="#1b1b1e" stroke-width="2" fill="none"/></pattern>
    <filter id="rough" x="-10%" y="-30%" width="120%" height="170%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="15" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="380" fill="url(#brick)"/>

  <g filter="url(#rough)" font-family="Impact, 'Arial Black', sans-serif" font-size="64" text-anchor="middle" letter-spacing="5">
    <text x="604" y="76" fill="#000" opacity=".85">MULTIPLATAFORMA</text>
    <text x="600" y="72" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round">MULTIPLATAFORMA</text>
    <text x="600" y="72" fill="url(#red)" stroke="#2a0000" stroke-width="2">MULTIPLATAFORMA</text>
  </g>
  <text x="600" y="106" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="5" fill="#bbb">O GENNISCODE ESTÁ DISPONÍVEL PARA</text>

  <!-- WINDOWS -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite"/>
    <rect x="75" y="140" width="230" height="200" rx="14" fill="#ff1e1e" opacity=".3" filter="url(#b)"/>
    <rect x="75" y="140" width="230" height="200" rx="14" fill="url(#card)" stroke="#ff1e1e" stroke-width="3"/>
    <g fill="url(#red)" transform="translate(145 170)">
      <path d="M0 6 L38 0 V38 H0Z"/><path d="M44 0 L90 -6 V38 H44Z" transform="translate(0 0)"/>
      <path d="M0 46 H38 V84 L0 78Z"/><path d="M44 46 H90 V90 L44 84Z"/>
    </g>
    <text x="190" y="305" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="3" fill="#fff">WINDOWS</text>
  </g>

  <!-- LINUX -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -10;0 0;0 -10" dur="3.6s" repeatCount="indefinite"/>
    <rect x="340" y="140" width="230" height="200" rx="14" fill="#ff1e1e" opacity=".3" filter="url(#b)"/>
    <rect x="340" y="140" width="230" height="200" rx="14" fill="url(#card)" stroke="#ff1e1e" stroke-width="3"/>
    <rect x="405" y="170" width="100" height="84" rx="10" fill="#070707" stroke="url(#red)" stroke-width="5"/>
    <path d="M425 195 L445 210 L425 225" fill="none" stroke="#ff1e1e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="455" y="222" width="30" height="7" rx="3" fill="#ff1e1e"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
    <text x="455" y="305" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="3" fill="#fff">LINUX</text>
  </g>

  <!-- MACOS -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="630" y="140" width="230" height="200" rx="14" fill="#ff1e1e" opacity=".3" filter="url(#b)"/>
    <rect x="630" y="140" width="230" height="200" rx="14" fill="url(#card)" stroke="#ff1e1e" stroke-width="3"/>
    <rect x="695" y="168" width="100" height="86" rx="22" fill="none" stroke="url(#red)" stroke-width="6"/>
    <text x="745" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ff1e1e">⌘</text>
    <text x="745" y="305" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="3" fill="#fff">MACOS</text>
  </g>

  <!-- ANDROID -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -10;0 0;0 -10" dur="3.4s" repeatCount="indefinite"/>
    <rect x="895" y="140" width="230" height="200" rx="14" fill="#ff1e1e" opacity=".3" filter="url(#b)"/>
    <rect x="895" y="140" width="230" height="200" rx="14" fill="url(#card)" stroke="#ff1e1e" stroke-width="3"/>
    <path d="M965 232 A45 45 0 0 1 1055 232 Z" fill="url(#red)"/>
    <rect x="965" y="240" width="90" height="26" rx="8" fill="url(#red)"/>
    <circle cx="990" cy="215" r="5" fill="#0b0b0c"/><circle cx="1030" cy="215" r="5" fill="#0b0b0c"/>
    <path d="M978 192 L968 175 M1042 192 L1052 175" stroke="#ff1e1e" stroke-width="5" stroke-linecap="round"/>
    <text x="1010" y="305" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="34" letter-spacing="3" fill="#fff">ANDROID</text>
  </g>

  <!-- drips -->
  <g stroke="#ff1e1e" stroke-linecap="round">
    <line x1="190" y1="340" x2="190" y2="344" stroke-width="7"><animate attributeName="y2" values="344;372;344" dur="4s" repeatCount="indefinite"/></line>
    <line x1="455" y1="340" x2="455" y2="344" stroke-width="6"><animate attributeName="y2" values="344;368;344" dur="3.3s" repeatCount="indefinite"/></line>
    <line x1="745" y1="340" x2="745" y2="344" stroke-width="7"><animate attributeName="y2" values="344;374;344" dur="4.6s" repeatCount="indefinite"/></line>
    <line x1="1010" y1="340" x2="1010" y2="344" stroke-width="6"><animate attributeName="y2" values="344;370;344" dur="3.7s" repeatCount="indefinite"/></line>
  </g>
</svg>
