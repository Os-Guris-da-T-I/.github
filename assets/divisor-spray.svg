<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ff1e1e" stop-opacity="0"/>
      <stop offset=".15" stop-color="#ff1e1e"/>
      <stop offset=".85" stop-color="#b00000"/>
      <stop offset="1" stop-color="#b00000" stop-opacity="0"/>
    </linearGradient>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="40" y="36" width="1120" height="22" rx="11" fill="#ff1e1e" opacity=".45" filter="url(#b)"/>
  <rect x="40" y="40" width="1120" height="12" rx="6" fill="url(#g)" filter="url(#r)">
    <animate attributeName="opacity" values="1;.75;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g fill="#ff1e1e">
    <circle cx="180" cy="28" r="2.5"/><circle cx="420" cy="66" r="3"/><circle cx="640" cy="24" r="2"/>
    <circle cx="880" cy="68" r="3"/><circle cx="1040" cy="30" r="2.5"/><circle cx="300" cy="70" r="2"/>
  </g>
  <g stroke="#ff1e1e" stroke-linecap="round">
    <line x1="260" y1="52" x2="260" y2="70" stroke-width="5"><animate attributeName="y2" values="62;84;62" dur="3.6s" repeatCount="indefinite"/></line>
    <line x1="560" y1="52" x2="560" y2="66" stroke-width="4"><animate attributeName="y2" values="60;80;60" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="940" y1="52" x2="940" y2="72" stroke-width="5"><animate attributeName="y2" values="64;86;64" dur="4.2s" repeatCount="indefinite"/></line>
  </g>
</svg>
