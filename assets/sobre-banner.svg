<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Quem somos">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".5" stop-color="#ff1e1e"/><stop offset="1" stop-color="#7a0000"/></linearGradient>
    <pattern id="brick" width="120" height="60" patternUnits="userSpaceOnUse"><rect width="120" height="60" fill="#0b0b0c"/><path d="M0 0H120M0 30H120M0 60H120M60 0V30M0 30V60M120 30V60" stroke="#1b1b1e" stroke-width="2" fill="none"/></pattern>
    <filter id="rough" x="-10%" y="-30%" width="120%" height="170%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter>
    <filter id="b"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="190" fill="url(#brick)"/>
  <ellipse cx="600" cy="95" rx="320" ry="50" fill="#ff1e1e" opacity=".4" filter="url(#b)"><animate attributeName="opacity" values=".25;.5;.25" dur="3.5s" repeatCount="indefinite"/></ellipse>
  <g filter="url(#rough)" font-family="Impact, 'Arial Black', sans-serif" font-size="108" text-anchor="middle" letter-spacing="6">
    <text x="606" y="124" fill="#000" opacity=".85">QUEM SOMOS</text>
    <text x="600" y="118" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round">QUEM SOMOS</text>
    <text x="600" y="118" fill="url(#red)" stroke="#2a0000" stroke-width="3">QUEM SOMOS</text>
  </g>
  <g stroke="#ff1e1e" stroke-linecap="round">
    <line x1="400" y1="122" x2="400" y2="140" stroke-width="8"><animate attributeName="y2" values="136;176;136" dur="3.8s" repeatCount="indefinite"/></line>
    <line x1="640" y1="122" x2="640" y2="138" stroke-width="7"><animate attributeName="y2" values="134;172;134" dur="3s" repeatCount="indefinite"/></line>
    <line x1="820" y1="122" x2="820" y2="142" stroke-width="9"><animate attributeName="y2" values="138;180;138" dur="4.4s" repeatCount="indefinite"/></line>
  </g>
  <text x="600" y="168" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="6" fill="#bbb">UNIVERSITÁRIOS · CRIADORES · EDUCADORES</text>
</svg>
